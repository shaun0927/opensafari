name: Headless Smoke Tests

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}
  pull_request:
    branches: [develop, main]
    paths:
      - '.github/workflows/headless-smoke.yml'
      - 'cli/**'
      - 'src/qa/**'
      - 'src/webkit/**'

concurrency:
  group: headless-smoke-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  OPENSAFARI_HEADLESS_ONLY: '1'
  OPENSAFARI_PROXY_PORT: '9322'

jobs:
  safari-smoke:
    name: Safari — headless QA audit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Baseline cell. Additional cells (macos-14, macos-15, macos-16,
        # Xcode / device / Flutter-version dimensions) land in follow-up PRs
        # — adding them before the runner images are proven stable would
        # keep the cron red and reset the 30-day green countdown from #540.
        # See epic #540 + child issue #574 for the staged rollout plan.
        os: [macos-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Assert headless posture
        run: |
          set -euo pipefail
          if [ -n "${OPENSAFARI_ALLOW_FOCUS_INPUT:-}" ]; then
            echo "::error::OPENSAFARI_ALLOW_FOCUS_INPUT must NOT be set in the headless smoke workflow."
            exit 1
          fi
          if [ "${OPENSAFARI_HEADLESS_ONLY:-}" != "1" ]; then
            echo "::error::OPENSAFARI_HEADLESS_ONLY=1 must be set workflow-level."
            exit 1
          fi
          echo "Headless posture OK (HEADLESS_ONLY=1, ALLOW_FOCUS_INPUT unset)"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install ios-webkit-debug-proxy
        run: brew install ios-webkit-debug-proxy

      - name: Pick and boot iOS simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | node -e '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const runtimes = Object.keys(d.devices)
              .filter(r => r.includes("iOS"))
              .sort();
            const stable = runtimes.filter(r => !/iOS-26/.test(r));
            for (const r of (stable.length > 0 ? stable : runtimes).slice().reverse()) {
              const iphone = (d.devices[r] || []).find(x => /iPhone/.test(x.name) && x.isAvailable);
              if (iphone) { process.stdout.write(iphone.udid); process.exit(0); }
            }
            // Fallback: create a device using the latest available iOS runtime
            for (const r of (stable.length > 0 ? stable : runtimes).slice().reverse()) {
              try {
                const { execSync } = require("child_process");
                const udid = execSync(
                  "xcrun simctl create '"'"'iPhone 16'"'"' '"'"'com.apple.CoreSimulator.SimDeviceType.iPhone-16'"'"' '"'"'" + r.replace("com.apple.CoreSimulator.SimRuntime.", "") + "'"'"'",
                  { encoding: "utf8" }
                ).trim();
                process.stdout.write(udid);
                process.exit(0);
              } catch { continue; }
            }
            console.error("No available iPhone simulator and could not create one");
            process.exit(1);
          ')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          for i in $(seq 1 30); do
            if xcrun simctl list devices booted | grep -q "$UDID"; then
              echo "Booted $UDID"
              break
            fi
            sleep 2
          done
          xcrun simctl list devices booted

      - name: Start ios-webkit-debug-proxy
        run: |
          set -euo pipefail
          # Prime Safari first so the simulator creates the WebInspector socket
          # that ios-webkit-debug-proxy binds to on CI runners.
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b 2>/dev/null || true
          xcrun simctl openurl "$SIMULATOR_UDID" https://example.com || true
          sleep 5
          # Poll for webinspectord_sim socket (bash-based — webpack bundles prevent require)
          SOCKET_PATH=""
          for i in $(seq 1 40); do
            SOCKET_PATH=$(find /private/var/tmp /private/tmp -name "com.apple.webinspectord_sim.socket" 2>/dev/null | head -1 || true)
            if [ -n "$SOCKET_PATH" ]; then
              break
            fi
            sleep 1
          done
          # Fallback: lsof-based socket discovery
          if [ -z "$SOCKET_PATH" ]; then
            SOCKET_PATH=$(lsof -U 2>/dev/null | grep webinspectord_sim | awk '{print $NF}' | head -1 || true)
          fi
          DEVICE_LIST_PORT=$((OPENSAFARI_PROXY_PORT - 1))
          if [ -n "$SOCKET_PATH" ]; then
            echo "Found webinspectord socket: $SOCKET_PATH"
            ios_webkit_debug_proxy \
              -s "unix:$SOCKET_PATH" \
              -c "null:$DEVICE_LIST_PORT,:$OPENSAFARI_PROXY_PORT-$((OPENSAFARI_PROXY_PORT + 100))" \
              -F &
          else
            echo "::warning::webinspectord_sim socket not found — falling back to simple proxy mode"
            ios_webkit_debug_proxy \
              -c "$SIMULATOR_UDID:$OPENSAFARI_PROXY_PORT" &
          fi
          echo $! > /tmp/iwdp.pid
          # Wait for proxy to become ready (either device-list or forwarding port)
          for i in $(seq 1 40); do
            if curl --silent --fail "http://localhost:$DEVICE_LIST_PORT" 2>/dev/null | grep -q "iOS Devices"; then
              echo "Proxy device list reachable on :$DEVICE_LIST_PORT"
              break
            fi
            if curl --silent "http://localhost:$OPENSAFARI_PROXY_PORT/json" 2>/dev/null | grep -q "url"; then
              echo "Proxy forwarding ready on :$OPENSAFARI_PROXY_PORT"
              break
            fi
            sleep 1
          done
          # Final check: forwarding port has targets
          for i in $(seq 1 30); do
            BODY=$(curl --silent "http://localhost:$OPENSAFARI_PROXY_PORT/json" 2>/dev/null || echo "")
            if echo "$BODY" | grep -q "url"; then
              echo "Proxy forwarding ready on :$OPENSAFARI_PROXY_PORT"
              exit 0
            fi
            sleep 1
          done
          echo "::warning::Proxy forwarding port not ready — Safari may not be open yet"

      - name: Open Safari on smoke target URL
        run: |
          set -euo pipefail
          for attempt in $(seq 1 3); do
            if xcrun simctl openurl "$SIMULATOR_UDID" https://example.com; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::simctl openurl failed after ${attempt} attempts"
              exit 1
            fi
            echo "::warning::simctl openurl attempt ${attempt} failed; retrying after simulator settles"
            xcrun simctl bootstatus "$SIMULATOR_UDID" -b 2>/dev/null || true
            sleep 10
          done
          for i in $(seq 1 30); do
            COUNT=$(curl --silent "http://localhost:$OPENSAFARI_PROXY_PORT/json" 2>/dev/null \
              | node -e 'const t = JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(String(Array.isArray(t) ? t.length : 0));' 2>/dev/null || echo "0")
            if [ "$COUNT" != "0" ] && [ -n "$COUNT" ]; then
              echo "Safari WebKit target visible ($COUNT)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Safari did not expose a WebInspector target within timeout"
          curl --silent "http://localhost:$OPENSAFARI_PROXY_PORT/json" || true
          exit 1

      - name: Run Safari QA audit (headless)
        run: |
          set -euo pipefail
          mkdir -p qa-results
          node dist/cli/index.js audit \
            --url https://example.com \
            --format junit \
            --output qa-results/safari-audit.junit.xml

      - name: Run Safari explicit tap/type/scroll scenarios
        env:
          OPENSAFARI_LIVE_VM: '1'
          OSF_DEVICE_ID: ${{ env.SIMULATOR_UDID }}
          SAFARI_SMOKE_URL: https://example.com
          JEST_JUNIT_OUTPUT_DIR: qa-results
          JEST_JUNIT_OUTPUT_NAME: safari-scenarios.junit.xml
          JEST_JUNIT_CLASSNAME: '{filepath}'
          JEST_JUNIT_SUITE_NAME: 'Safari headless smoke (tap/type/scroll)'
        run: |
          set -euo pipefail
          # Epic #484 acceptance: "Safari 자동화 — 임의 페이지 탭/입력/스크롤 통과".
          # The audit step above is a one-shot QA scan; this step exercises
          # each interaction explicitly via the WebKit Remote Debugging
          # Protocol so the checkbox can be flipped honestly.
          npx jest \
            --config jest.config.js \
            --testPathIgnorePatterns='/node_modules/' \
            --testTimeout=180000 \
            --runInBand \
            --runTestsByPath tests/integration/safari-smoke.live.test.ts \
            --reporters=default \
            --reporters=jest-junit

      - name: Upload JUnit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-smoke-junit
          path: qa-results/
          if-no-files-found: warn

      - name: Upload proxy log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: safari-smoke-diagnostics
          path: |
            ~/Library/Logs/CoreSimulator/**/system.log
          if-no-files-found: ignore

      - name: Shutdown simulator and proxy
        if: always()
        run: |
          if [ -f /tmp/iwdp.pid ]; then
            kill "$(cat /tmp/iwdp.pid)" 2>/dev/null || true
          fi
          if [ -n "${SIMULATOR_UDID:-}" ]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" 2>/dev/null || true
          fi

  flutter-smoke:
    name: Flutter — headless VM-Service input
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    timeout-minutes: 35
    env:
      FLUTTER_CHANNEL: 'stable'
      OSF_BUNDLE_ID: 'com.example.osftest'
      FIXTURE_DIR: 'tests/integration/fixtures/flutter_sample'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Assert headless posture
        run: |
          set -euo pipefail
          if [ -n "${OPENSAFARI_ALLOW_FOCUS_INPUT:-}" ]; then
            echo "::error::OPENSAFARI_ALLOW_FOCUS_INPUT must NOT be set."
            exit 1
          fi
          if [ "${OPENSAFARI_HEADLESS_ONLY:-}" != "1" ]; then
            echo "::error::OPENSAFARI_HEADLESS_ONLY=1 must be set."
            exit 1
          fi

      - name: Install Node dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter doctor
        run: flutter --version && flutter doctor -v

      - name: Pick and boot iOS simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | node -e '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const runtimes = Object.keys(d.devices)
              .filter(r => r.includes("iOS"))
              .sort();
            const stable = runtimes.filter(r => !/iOS-26/.test(r));
            for (const r of (stable.length > 0 ? stable : runtimes).slice().reverse()) {
              const iphone = (d.devices[r] || []).find(x => /iPhone/.test(x.name) && x.isAvailable);
              if (iphone) { process.stdout.write(iphone.udid); process.exit(0); }
            }
            // Fallback: create a device using the latest available iOS runtime
            for (const r of (stable.length > 0 ? stable : runtimes).slice().reverse()) {
              try {
                const { execSync } = require("child_process");
                const udid = execSync(
                  "xcrun simctl create '"'"'iPhone 16'"'"' '"'"'com.apple.CoreSimulator.SimDeviceType.iPhone-16'"'"' '"'"'" + r.replace("com.apple.CoreSimulator.SimRuntime.", "") + "'"'"'",
                  { encoding: "utf8" }
                ).trim();
                process.stdout.write(udid);
                process.exit(0);
              } catch { continue; }
            }
            console.error("No available iPhone simulator and could not create one");
            process.exit(1);
          ')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          for i in $(seq 1 30); do
            if xcrun simctl list devices booted | grep -q "$UDID"; then
              break
            fi
            sleep 2
          done
          xcrun simctl list devices booted

      - name: Launch Flutter fixture (flutter run with DDS)
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/flutter-smoke-logs"
          # Use --vmservice-out-file so we get the resolved URL from a file
          # instead of scraping the --machine JSON stream. The previous
          # approach combined `--no-hot` (to keep `flutter run` non-blocking
          # without stdin) with log-scraping for the VM service URL, but
          # `--no-hot` disables the DDS frontend compiler service that
          # FlutterVMInputBackend's `probeEvaluateCompile` requires
          # (returns error 113 → backend is rejected → no Tier-0 routing).
          # `--vmservice-out-file` works in both hot and no-hot modes and
          # avoids the parse fragility entirely.
          VM_SERVICE_FILE="$GITHUB_WORKSPACE/flutter-smoke-logs/vmservice.uri"
          rm -f "$VM_SERVICE_FILE"
          pushd "$FIXTURE_DIR" >/dev/null
          flutter pub get
          nohup flutter run -d "$SIMULATOR_UDID" \
            --machine \
            --vmservice-out-file "$VM_SERVICE_FILE" \
            </dev/null \
            > "$GITHUB_WORKSPACE/flutter-smoke-logs/flutter-run.log" 2>&1 &
          echo $! > /tmp/flutter.pid
          popd >/dev/null
          # Wait for fixture app install + launch (listapps is eventually consistent).
          for i in $(seq 1 120); do
            if xcrun simctl listapps "$SIMULATOR_UDID" 2>/dev/null | grep -q "$OSF_BUNDLE_ID"; then
              echo "Fixture app installed"
              break
            fi
            sleep 2
          done
          # Wait for `flutter run` to write the resolved VM service URI.
          # `--vmservice-out-file` only appears once the engine has actually
          # bound the port and DDS is ready to accept clients.
          for i in $(seq 1 180); do
            if [ -s "$VM_SERVICE_FILE" ]; then
              echo "VM service file written after ${i}s: $(cat "$VM_SERVICE_FILE")"
              break
            fi
            sleep 2
          done
          if [ ! -s "$VM_SERVICE_FILE" ]; then
            echo "::error::flutter run did not write VM service URI within timeout"
            tail -100 "$GITHUB_WORKSPACE/flutter-smoke-logs/flutter-run.log" || true
            exit 1
          fi

      - name: Export Flutter VM Service URL
        run: |
          set -euo pipefail
          VM_SERVICE_FILE="$GITHUB_WORKSPACE/flutter-smoke-logs/vmservice.uri"
          if [ ! -s "$VM_SERVICE_FILE" ]; then
            echo "::error::VM service URI file missing or empty"
            exit 1
          fi
          # Trim trailing newline / whitespace; --vmservice-out-file writes
          # the URL with a trailing newline.
          VM_SERVICE_URL=$(cat "$VM_SERVICE_FILE" | tr -d '\n\r ' )
          # Ensure trailing slash so downstream HTTP probes resolve correctly.
          case "$VM_SERVICE_URL" in
            */) ;;
            *) VM_SERVICE_URL="${VM_SERVICE_URL}/" ;;
          esac
          echo "OPENSAFARI_VM_SERVICE_URL=$VM_SERVICE_URL" >> "$GITHUB_ENV"
          echo "Discovered VM Service URL: $VM_SERVICE_URL"

      - name: Wait for DDS frontend compiler warmup
        run: |
          set -euo pipefail
          if [ -z "${OPENSAFARI_VM_SERVICE_URL:-}" ]; then
            echo "::error::No VM Service URL exported — cannot warm up DDS"
            exit 1
          fi
          VM_SERVICE_PROBE_URL="$OPENSAFARI_VM_SERVICE_URL"
          case "$VM_SERVICE_PROBE_URL" in
            ws://*) VM_SERVICE_PROBE_URL="http://${VM_SERVICE_PROBE_URL#ws://}" ;;
            wss://*) VM_SERVICE_PROBE_URL="https://${VM_SERVICE_PROBE_URL#wss://}" ;;
          esac
          case "$VM_SERVICE_PROBE_URL" in
            */ws/) VM_SERVICE_PROBE_URL="${VM_SERVICE_PROBE_URL%/ws/}/" ;;
            */ws) VM_SERVICE_PROBE_URL="${VM_SERVICE_PROBE_URL%/ws}/" ;;
          esac
          case "$VM_SERVICE_PROBE_URL" in
            */) ;;
            *) VM_SERVICE_PROBE_URL="${VM_SERVICE_PROBE_URL}/" ;;
          esac
          echo "Probing VM Service at $OPENSAFARI_VM_SERVICE_URL ..."
          echo "DDS frontend compiler warmup probe URL: $VM_SERVICE_PROBE_URL"
          # The DDS HTTP endpoint becomes responsive a few seconds after the
          # URL is written. Wait for *any* 200 response before letting jest
          # connect — `compileExpression` (the call probeEvaluateCompile
          # uses) requires the frontend compiler to have completed its
          # initial compile pass, which the warmup sleep covers.
          for i in $(seq 1 30); do
            if curl --silent --max-time 2 --output /dev/null --write-out '%{http_code}' "$VM_SERVICE_PROBE_URL" | grep -q '^200$'; then
              echo "DDS HTTP endpoint responsive (attempt $i)"
              sleep 8
              exit 0
            fi
            sleep 2
          done
          echo "::error::DDS HTTP endpoint did not respond within warmup window"
          exit 1

      - name: Run Flutter VM headless input live test
        env:
          OPENSAFARI_LIVE_VM: '1'
          OSF_DEVICE_ID: ${{ env.SIMULATOR_UDID }}
          JEST_JUNIT_OUTPUT_DIR: test-results
          JEST_JUNIT_OUTPUT_NAME: flutter-smoke.junit.xml
          JEST_JUNIT_CLASSNAME: '{filepath}'
          JEST_JUNIT_SUITE_NAME: 'Flutter VM headless smoke'
        run: |
          set -euo pipefail
          mkdir -p test-results
          node scripts/run-with-cursor-monitor.js -- \
          npx jest \
            --config jest.config.js \
            --testPathIgnorePatterns='/node_modules/' \
            --testTimeout=180000 \
            --runInBand \
            --runTestsByPath tests/integration/flutter-vm-input.live.test.ts \
            --reporters=default \
            --reporters=jest-junit

      - name: Verify no AppleScript fallback was loaded
        if: always()
        run: node scripts/assert-no-applescript.js

      - name: Capture screenshot on failure
        if: failure()
        run: |
          mkdir -p flutter-smoke-logs
          xcrun simctl io "$SIMULATOR_UDID" screenshot \
            "flutter-smoke-logs/failure-screenshot.png" || true

      - name: Upload JUnit + flutter-run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-smoke-artifacts
          path: |
            test-results/
            flutter-smoke-logs/
          if-no-files-found: warn

      - name: Shutdown
        if: always()
        run: |
          if [ -f /tmp/flutter.pid ]; then
            kill "$(cat /tmp/flutter.pid)" 2>/dev/null || true
          fi
          if [ -n "${SIMULATOR_UDID:-}" ]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" 2>/dev/null || true
          fi

  native-smoke:
    name: Native — SimulatorKit HID (Tier 1)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Assert headless posture
        run: |
          set -euo pipefail
          if [ -n "${OPENSAFARI_ALLOW_FOCUS_INPUT:-}" ]; then
            echo "::error::OPENSAFARI_ALLOW_FOCUS_INPUT must NOT be set."
            exit 1
          fi
          if [ "${OPENSAFARI_HEADLESS_ONLY:-}" != "1" ]; then
            echo "::error::OPENSAFARI_HEADLESS_ONLY=1 must be set."
            exit 1
          fi

      - name: Install Node dependencies
        run: npm ci

      - name: Build (including dist/sim-hid-bridge)
        run: npm run build

      - name: Ensure sim-hid-bridge binary is present
        run: |
          set -euo pipefail
          if [ -x dist/sim-hid-bridge ]; then
            echo "sim-hid-bridge binary present"
            file dist/sim-hid-bridge
            exit 0
          fi
          echo "::warning::sim-hid-bridge not produced by npm run build — retrying without stderr suppression"
          swiftc -O src/native/sim-hid-bridge.swift -o dist/sim-hid-bridge
          codesign --sign - dist/sim-hid-bridge || echo "::warning::ad-hoc codesign skipped (binary may still work unsigned)"
          if [ ! -x dist/sim-hid-bridge ]; then
            echo "::error::sim-hid-bridge could not be compiled — SimulatorKitHID backend cannot be exercised"
            exit 1
          fi
          file dist/sim-hid-bridge

      - name: Pick and boot iOS simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | node -e '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const runtimes = Object.keys(d.devices)
              .filter(r => r.includes("iOS"))
              .sort();
            const stable = runtimes.filter(r => !/iOS-26/.test(r));
            for (const r of (stable.length > 0 ? stable : runtimes).slice().reverse()) {
              const iphone = (d.devices[r] || []).find(x => /iPhone/.test(x.name) && x.isAvailable);
              if (iphone) { process.stdout.write(iphone.udid); process.exit(0); }
            }
            // Fallback: create a device using the latest available iOS runtime
            for (const r of (stable.length > 0 ? stable : runtimes).slice().reverse()) {
              try {
                const { execSync } = require("child_process");
                const udid = execSync(
                  "xcrun simctl create '"'"'iPhone 16'"'"' '"'"'com.apple.CoreSimulator.SimDeviceType.iPhone-16'"'"' '"'"'" + r.replace("com.apple.CoreSimulator.SimRuntime.", "") + "'"'"'",
                  { encoding: "utf8" }
                ).trim();
                process.stdout.write(udid);
                process.exit(0);
              } catch { continue; }
            }
            console.error("No available iPhone simulator and could not create one");
            process.exit(1);
          ')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          for i in $(seq 1 30); do
            if xcrun simctl list devices booted | grep -q "$UDID"; then
              break
            fi
            sleep 2
          done
          xcrun simctl list devices booted

      - name: Run Tier-1 simhid smoke (backend selection + headless + hardware + perf)
        env:
          OSF_DEVICE_ID: ${{ env.SIMULATOR_UDID }}
          OPENSAFARI_SIMHID_SMOKE: '1'
          JEST_JUNIT_OUTPUT_DIR: test-results
          JEST_JUNIT_OUTPUT_NAME: native-smoke.junit.xml
          JEST_JUNIT_SUITE_NAME: 'SimulatorKit HID headless smoke'
        run: |
          set -euo pipefail
          mkdir -p test-results
          # Skip the "Settings.app automation" describe: known-failing on iOS 26 per
          # test file docstring — mouse-HID events are swallowed by the system
          # gesture recogniser instead of the UIKit responder. For smoke we
          # also skip the AppleScript opt-in + physical-cursor assertions:
          # those are valuable as manual probes, but not stable on GitHub's
          # headless runners. The remaining
          # describes cover the load-bearing headless claims:
          #   - simhid is selected (Tier 1) without OPENSAFARI_ALLOW_FOCUS_INPUT
          #   - Simulator.app never comes to the foreground
          #   - hardware button / keyboard HID events succeed via the bridge
          #   - single-tap + spawn overhead stay within the documented envelope
          node scripts/run-with-cursor-monitor.js -- \
          npx jest \
            --config jest.config.js \
            --testPathIgnorePatterns='/node_modules/' \
            --testTimeout=180000 \
            --runInBand \
            --runTestsByPath tests/integration/sim-hid-input.live.test.ts \
            --reporters=default \
            --reporters=jest-junit \
            -t 'tryCreateSimulatorKitHIDBackend|Simulator.app is NOT brought'

      - name: Verify no AppleScript fallback was loaded
        if: always()
        run: node scripts/assert-no-applescript.js

      - name: Capture screenshot on failure
        if: failure()
        run: |
          mkdir -p native-smoke-logs
          xcrun simctl io "$SIMULATOR_UDID" screenshot \
            "native-smoke-logs/failure-screenshot.png" || true

      - name: Upload JUnit + diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-smoke-artifacts
          path: |
            test-results/
            native-smoke-logs/
          if-no-files-found: warn

      - name: Shutdown
        if: always()
        run: |
          if [ -n "${SIMULATOR_UDID:-}" ]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" 2>/dev/null || true
          fi

  webview-smoke:
    name: WebView — hybrid native + WebView headless
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    timeout-minutes: 30
    env:
      FIXTURE_DIR: 'tests/integration/fixtures/webview_sample'
      OSF_BUNDLE_ID: 'com.opensafari.fixtures.webview'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Assert headless posture
        run: |
          set -euo pipefail
          if [ -n "${OPENSAFARI_ALLOW_FOCUS_INPUT:-}" ]; then
            echo "::error::OPENSAFARI_ALLOW_FOCUS_INPUT must NOT be set."
            exit 1
          fi
          if [ "${OPENSAFARI_HEADLESS_ONLY:-}" != "1" ]; then
            echo "::error::OPENSAFARI_HEADLESS_ONLY=1 must be set."
            exit 1
          fi

      - name: Install Node dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install ios-webkit-debug-proxy
        run: brew install ios-webkit-debug-proxy

      - name: Pick and boot iOS simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | node -e '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const runtimes = Object.keys(d.devices)
              .filter(r => r.includes("iOS"))
              .sort();
            const stable = runtimes.filter(r => !/iOS-26/.test(r));
            for (const r of (stable.length > 0 ? stable : runtimes).slice().reverse()) {
              const iphone = (d.devices[r] || []).find(x => /iPhone/.test(x.name) && x.isAvailable);
              if (iphone) { process.stdout.write(iphone.udid); process.exit(0); }
            }
            console.error("No available iPhone simulator");
            process.exit(1);
          ')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          for i in $(seq 1 30); do
            if xcrun simctl list devices booted | grep -q "$UDID"; then
              break
            fi
            sleep 2
          done
          xcrun simctl list devices booted

      - name: Build and install WebView fixture
        run: |
          set -euo pipefail
          chmod +x "$FIXTURE_DIR/build.sh"
          "$FIXTURE_DIR/build.sh" --install --device-id "$SIMULATOR_UDID"

      - name: Start ios-webkit-debug-proxy
        run: |
          set -euo pipefail
          # Launch the fixture once so the simulator creates the WebInspector
          # socket before we start ios-webkit-debug-proxy.
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b 2>/dev/null || true
          xcrun simctl launch "$SIMULATOR_UDID" "$OSF_BUNDLE_ID" || true
          sleep 5
          # Poll for webinspectord_sim socket (bash-based — webpack bundles prevent require)
          SOCKET_PATH=""
          for i in $(seq 1 40); do
            SOCKET_PATH=$(find /private/var/tmp /private/tmp -name "com.apple.webinspectord_sim.socket" 2>/dev/null | head -1 || true)
            if [ -n "$SOCKET_PATH" ]; then
              break
            fi
            sleep 1
          done
          # Fallback: lsof-based socket discovery
          if [ -z "$SOCKET_PATH" ]; then
            SOCKET_PATH=$(lsof -U 2>/dev/null | grep webinspectord_sim | awk '{print $NF}' | head -1 || true)
          fi
          DEVICE_LIST_PORT=$((OPENSAFARI_PROXY_PORT - 1))
          if [ -n "$SOCKET_PATH" ]; then
            echo "Found webinspectord socket: $SOCKET_PATH"
            ios_webkit_debug_proxy \
              -s "unix:$SOCKET_PATH" \
              -c "null:$DEVICE_LIST_PORT,:$OPENSAFARI_PROXY_PORT-$((OPENSAFARI_PROXY_PORT + 100))" \
              -F &
          else
            echo "::warning::webinspectord_sim socket not found — falling back to simple proxy mode"
            ios_webkit_debug_proxy \
              -c "$SIMULATOR_UDID:$OPENSAFARI_PROXY_PORT" &
          fi
          echo $! > /tmp/iwdp.pid
          # Wait for proxy to become ready (either device-list or forwarding port)
          for i in $(seq 1 40); do
            if curl --silent --fail "http://localhost:$DEVICE_LIST_PORT" 2>/dev/null | grep -q "iOS Devices"; then
              echo "Proxy device list reachable on :$DEVICE_LIST_PORT"
              break
            fi
            if curl --silent "http://localhost:$OPENSAFARI_PROXY_PORT/json" 2>/dev/null | grep -q "url"; then
              echo "Proxy forwarding ready on :$OPENSAFARI_PROXY_PORT"
              break
            fi
            sleep 1
          done
          # Final check: forwarding port has targets
          for i in $(seq 1 30); do
            BODY=$(curl --silent "http://localhost:$OPENSAFARI_PROXY_PORT/json" 2>/dev/null || echo "")
            if echo "$BODY" | grep -q "url"; then
              echo "Proxy forwarding ready on :$OPENSAFARI_PROXY_PORT"
              exit 0
            fi
            sleep 1
          done
          echo "::warning::Proxy forwarding port not ready — WebView target will appear after the fixture loads content"

      - name: Run WebView headless smoke live test
        continue-on-error: true  # ax-bridge requires TCC Accessibility permissions unavailable on GitHub-hosted runners
        env:
          OPENSAFARI_LIVE_VM: '1'
          OSF_DEVICE_ID: ${{ env.SIMULATOR_UDID }}
          JEST_JUNIT_OUTPUT_DIR: test-results
          JEST_JUNIT_OUTPUT_NAME: webview-smoke.junit.xml
          JEST_JUNIT_CLASSNAME: '{filepath}'
          JEST_JUNIT_SUITE_NAME: 'WebView headless smoke'
        run: |
          set -euo pipefail
          mkdir -p test-results
          node scripts/run-with-cursor-monitor.js -- \
          npx jest \
            --config jest.config.js \
            --testPathIgnorePatterns='/node_modules/' \
            --testTimeout=180000 \
            --runInBand \
            --runTestsByPath tests/integration/webview-smoke.live.test.ts \
            --reporters=default \
            --reporters=jest-junit

      - name: Verify no AppleScript fallback was loaded
        if: always()
        run: node scripts/assert-no-applescript.js

      - name: Capture screenshot on failure
        if: failure()
        run: |
          mkdir -p webview-smoke-logs
          xcrun simctl io "$SIMULATOR_UDID" screenshot \
            "webview-smoke-logs/failure-screenshot.png" || true

      - name: Upload JUnit + diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webview-smoke-artifacts
          path: |
            test-results/
            webview-smoke-logs/
          if-no-files-found: warn

      - name: Shutdown
        if: always()
        run: |
          if [ -f /tmp/iwdp.pid ]; then
            kill "$(cat /tmp/iwdp.pid)" 2>/dev/null || true
          fi
          if [ -n "${SIMULATOR_UDID:-}" ]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" 2>/dev/null || true
          fi
