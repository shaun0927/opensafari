name: Release Validation

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build
      - name: Runtime dependency audit (release gate)
        run: npm run audit:prod
      - name: Verify dist
        run: |
          test -f dist/index.js
          test -f dist/cli/index.js
          node dist/cli/index.js --help

      - name: Resolve package identity
        id: pkg
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved $NAME@$VERSION"

      - name: Report npm publication status
        run: |
          set -euo pipefail
          # Tag pushes are release validation only. Maintainers publish manually
          # from a local terminal after GitHub checks are green. Do not run
          # npm auth checks or npm publish from this workflow.
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "::notice::${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} is already published on npm."
          else
            echo "::notice::${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} is not published on npm yet. Publish manually after checks pass."
          fi

  notify:
    # Surface release validation failures the same way the sentinels do, so a
    # broken tag validation run cannot sit red unnoticed. npm publishing is
    # intentionally manual and is not performed by this workflow.
    needs: validate
    if: failure()
    uses: ./.github/workflows/_sentinel-notify.yml
    with:
      title: 'release validation failed'
      runner: 'macos-latest'
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      body: |
        The release validation workflow failed for a pushed v* tag.
        npm publishing is intentionally manual; inspect the validation, build,
        audit, or dist verification step that failed before publishing locally.
      channel: ${{ vars.SENTINEL_CHANNEL || '#opensafari-sentinels' }}
    secrets:
      webhook-url: ${{ secrets.SENTINEL_WEBHOOK_URL }}
