<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light dark">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="manifest" href="/manifest.json">
  <title>QA Detector Clean Reference Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; padding: 20px; color: #111; background: #fff; }
    input, select, textarea { font-size: 16px; padding: 12px; min-height: 44px; }
    button { min-width: 44px; min-height: 44px; padding: 12px 20px; font-size: 16px; }
    a { color: #0066cc; display: inline-block; min-height: 44px; line-height: 44px; }
    .section { margin: 20px 0; }
    h1 { margin-bottom: 10px; }
    h2 { margin-bottom: 8px; }
    label { display: block; margin-bottom: 4px; }
    img { max-width: 100%; }
  </style>
</head>
<body>
  <h1>QA Detector Clean Reference Page</h1>

  <div class="section">
    <h2>Form Section</h2>
    <label for="nameInput">Name</label>
    <input type="text" id="nameInput" name="name" placeholder="Your name">

    <label for="emailInput">Email</label>
    <input type="email" id="emailInput" name="email" placeholder="your@email.com">

    <label for="phoneInput">Phone</label>
    <input type="tel" id="phoneInput" name="phone" placeholder="+1 (555) 000-0000">
  </div>

  <div class="section">
    <h2>Interactive Elements</h2>
    <button id="submitBtn">Submit Form</button>
    <a href="#about">Learn about our services</a>
  </div>

  <div class="section">
    <h2>Media</h2>
    <img src="test-image.png" alt="Placeholder image" width="100" height="100">
  </div>

  <div class="section">
    <h2>Content</h2>
    <p style="color: #111; background: #fff;">This text has excellent contrast (high ratio).</p>
  </div>
</body>
</html>
